[workspace]
resolver = "3"
members = [
    "apps/locus-execd",
    "packages/artifacts",
    "packages/budget",
    "packages/coordination",
    "packages/deployment",
    "packages/domain",
    "packages/environments",
    "packages/evaluation",
    "packages/event-store",
    "packages/execution",
    "packages/graph",
    "packages/lep",
    "packages/migrations",
    "packages/policy",
    "packages/portfolio",
    "packages/projections",
    "packages/protocol",
    "packages/review",
    "packages/validation",
    "packages/visualization",
    "packages/workflow",
    "packages/workflow-backends",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94"
publish = false

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
