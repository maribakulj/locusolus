name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run check:format

      - name: Repository layout
        run: npm run check:repo

      - name: Retired project name
        run: npm run check:naming

      # Ces deux portes existaient dans `npm run check` sans avoir jamais tourné en CI :
      # `lep/1.0` est gelé, donc un exemple qui cesse de valider ou un SDK qui diverge de
      # son schéma sont exactement les régressions qu'on ne veut pas apprendre en aval.
      - name: Schemas
        run: npm run check:schemas

      - name: Generated SDK
        run: npm run check:generated

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  # Séparé de `check` pour une raison mesurée : l'installation d'Emacs a pris entre
  # quinze secondes et onze minutes selon le runner, et tant qu'elle était dans `check`
  # elle retardait huit portes qui n'en ont aucun besoin. Un verdict de format qui arrive
  # en trente secondes est un verdict qu'on lit ; le même onze minutes plus tard arrive
  # après qu'on est passé à autre chose.
  #
  # La couverture est inchangée : les deux portes qui exigent un Emacs sont ici, et elles
  # l'exigent toujours — `--require-emacs` leur interdit de se sauter en silence.
  emacs:
    name: emacs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # La règle 5 de CLAUDE.md se vérifie en démarrant un Emacs, pas en lisant du code.
      # `--require-emacs` interdit à la garde de sauter cette règle en silence quand le
      # binaire manque : une frontière non vérifiée doit se voir.
      #
      # Chaque tentative est bornée. Un miroir apt lent a déjà consommé les dix minutes du job
      # et fait annuler une CI verte par ailleurs : sans borne, la lenteur du réseau devient
      # indistinguable d'un test qui échoue. Le budget du job est passé à vingt minutes pour
      # que la reprise ait la place de servir.
      - name: Install Emacs
        # Une borne que le pas ne peut pas dépasser lui-même. Les `timeout` ci-dessous en sont une
        # aussi, mais elles ont été franchies trois fois : `timeout` envoie `TERM`, qu'un `apt`
        # arrêté sur le verrou `dpkg` n'honore pas, et l'échelle de reprises censée tenir en
        # vingt-trois minutes en a consommé plus de vingt-cinq. Celle-ci est appliquée par GitHub,
        # pas par le script, donc rien de ce que fait le script ne peut la desserrer.
        timeout-minutes: 12
        run: |
          # L'index du runner est déjà peuplé et `emacs-nox` est dans les dépôts de base : on tente
          # donc l'installation SANS `apt-get update`, qui est l'étape lente et la seule qui ait
          # jamais échoué ici. Le rafraîchissement de l'index n'est fait qu'en repli, et avec de
          # quoi aboutir — la première version de cette reprise bornait `update` à soixante
          # secondes, ce qui ne suffit pas à un miroir lent et faisait échouer les trois tentatives.
          #
          # `-k 30` sur chaque borne : `timeout` seul envoie `TERM`, et un `apt` bloqué sur le
          # verrou `dpkg` ne le prend pas. Trente secondes plus tard, `KILL` — que personne
          # n'ignore. Sans cela la borne est une intention, pas une borne.
          # Les bornes tiennent dans le plafond du pas, et c'est une correction : l'échelle
          # précédente demandait jusqu'à 240 + 2 × (300 + 240) + 30 de sommeil, soit dix-huit
          # minutes, là où GitHub coupe à douze. La seconde reprise ne pouvait donc jamais
          # s'exécuter, et la première était coupée en plein vol — une échelle à moitié morte, qui
          # avait l'air d'en offrir trois. Ici : 180 + 240 + 180 + 10 = 610 secondes, et il reste
          # cent dix secondes de marge pour l'`apt` que `TERM` n'a pas tué tout de suite.
          #
          # `-k 30` sur chaque borne : `timeout` seul envoie `TERM`, et un `apt` bloqué sur le
          # verrou `dpkg` ne le prend pas. Trente secondes plus tard, `KILL` — que personne
          # n'ignore. Sans cela la borne est une intention, pas une borne.
          attempt_install() {
            timeout -k 30 180 sudo apt-get install -y --no-install-recommends emacs-nox
          }
          if attempt_install; then
            exit 0
          fi
          echo "installation directe sans succès, rafraîchissement de l'index"
          timeout -k 30 240 sudo apt-get update || true
          sleep 10
          if attempt_install; then
            exit 0
          fi
          # Un miroir plus lent que cette échelle fait échouer le job, et c'est voulu : une
          # frontière non vérifiée doit se voir. Le pas a déjà rougi une fois sur un miroir lent, et
          # la réponse est de relancer, pas d'élargir la borne jusqu'à ce qu'elle ne borne plus.
          echo "emacs-nox introuvable : la frontière 5 ne peut pas être vérifiée"
          exit 1

      - name: Install
        run: npm ci

      # La règle 5 de CLAUDE.md se vérifie en démarrant un Emacs, pas en lisant du code.
      - name: Architectural boundaries
        run: npm run check:boundaries -- --require-emacs

      # Localement la suite peut se sauter faute d'Emacs, en CI elle ne le peut pas :
      # une suite qui se saute en silence ressemble en tout point à une suite qui passe.
      - name: Emacs client tests
        run: npm run check:emacs -- --require-emacs

      # Les assertions Node sur la règle 5 démarrent un vrai Emacs : elles se sautent dans le
      # job `check`, qui n'en a pas, et c'est ici qu'elles tournent réellement. Sans cette
      # étape, elles seraient sautées partout — un skip muet ressemble à un succès.
      - name: Boundary contract tests
        run: node --test "tests/boundaries/*.test.ts"

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # `W20.i` : la suite de contract tests du journal s'exécute contre **les deux** backends, et
    # elle ne peut pas éprouver le driver sans base. Un saut silencieux rendrait « vert » un dépôt
    # où le driver n'a jamais tourné — c'est pourquoi un test de cette suite **échoue** si `CI` est
    # défini et `LOCUS_TEST_POSTGRES` ne l'est pas. Ce service est ce qui le nourrit.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: locus
          POSTGRES_PASSWORD: locus
          POSTGRES_DB: locus_test
        ports:
          - 5432:5432
        # Sans ce contrôle de santé, les tests démarrent avant que la base accepte une connexion, et
        # l'échec se lit « driver non conforme » là où il faut lire « base pas encore prête ».
        #
        # `-U locus -d locus_test` et non `pg_isready` nu. La première rédaction omettait les deux :
        # `pg_isready` prend alors l'utilisateur du système, donc `root`, qui n'existe pas dans cette
        # image. Le journal du service en portait la trace — neuf `FATAL: role "root" does not exist`,
        # une toutes les dix secondes, pendant toute la durée du job. **Le contrôle n'est jamais passé
        # au vert**, donc il n'ordonnançait rien, et le commentaire au-dessus affirmait le contraire.
        # Une garde qui ne rapporte rien est la faute que ce dépôt traque partout ailleurs.
        options: >-
          --health-cmd "pg_isready -U locus -d locus_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      LOCUS_TEST_POSTGRES: "host=localhost port=5432 user=locus password=locus dbname=locus_test"

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml épingle la version et les composants ; rustup l'installe seul.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features

  # `W5.f` : la validation SÉMANTIQUE des sondes de sandbox, la seule chose que ni `sh -n` ni un
  # double ne peuvent dire. `tests/podman.rs` pilote un `ScriptedRunner` parce qu'« aucun runtime
  # rootless n'est garanti — c'est-à-dire en CI » ; ce job va vérifier si cette phrase est encore
  # vraie sur les images de runner d'aujourd'hui.
  #
  # Ce job a été une **question** avant d'être une garde. `continue-on-error: true` y était délibéré
  # et temporaire, avec sa condition de sortie écrite d'avance : « s'il devient vert,
  # `continue-on-error` tombe ». Sept sprints ont répondu — `W5.h` a corrigé les sondes que le
  # premier hôte réel démentait, `W5.l` a rendu les noms, `W5.n` et `W5.o` ont catalogué 255, `W5.q`
  # a lu ce que le runtime écrit, `W5.r` a rendu la contamination inexprimable, `W5.j` a mis le
  # quota là où la sandbox écrit, `W5.i` a fait dire à `S4` ce qu'il promet.
  #
  # Les seize sondes tiennent maintenant sur un runner ordinaire, et la tolérance est levée : une
  # garantie qu'on peut vérifier à chaque passage et qu'on tolère quand même n'est plus une
  # garantie, c'est une habitude.
  #
  # Le job imprime toujours autant et n'affirme rien qu'il ne puisse montrer — la table reste le
  # produit, verte ou rouge.
  sandbox:
    name: sandbox
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `continue-on-error` est **tombé** — W5.u. Il avait été posé parce que « personne ne sait
    # encore ce qu'un runner GitHub sait confiner, et un job rouge pour cette raison ferait rejeter
    # des PR qui n'y sont pour rien ». On sait maintenant : les seize sondes tiennent sur un runner
    # ordinaire. Une garantie qu'on peut vérifier à chaque passage et qu'on tolère quand même n'est
    # plus une garantie, c'est une habitude.
    #
    # Ce qui reste toléré est nommé, pas subi : l'épreuve du quota disque exige un hôte XFS que le
    # runner n'est pas, et elle a son propre pas.
    steps:
      - uses: actions/checkout@v4

      # Ce que l'hôte annonce, avant toute tentative. Un job qui échoue plus loin doit pouvoir se
      # relire ici : « pas de podman » et « podman mais pas de cgroups v2 » ne se réparent pas
      # pareil, et la table des sondes ne les distingue pas.
      - name: Ce que l'hôte annonce
        run: |
          echo "## Ce que l'hôte annonce" >> "$GITHUB_STEP_SUMMARY"
          {
            echo '```'
            echo "noyau        : $(uname -r)"
            echo "podman       : $(podman --version 2>&1 || echo absent)"
            echo "cgroup fstype: $(stat -fc %T /sys/fs/cgroup)"
            echo "cgroup v2    : $([ -f /sys/fs/cgroup/cgroup.controls ] && cat /sys/fs/cgroup/cgroup.controls || echo 'absent')"
            echo "subuid       : $(grep "^$(id -un):" /etc/subuid 2>/dev/null || echo 'aucune plage')"
            echo "unprivileged_userns_clone: $(cat /proc/sys/kernel/unprivileged_userns_clone 2>/dev/null || echo 'n/a')"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

      # L'image doit porter un digest — `Workload::new` refuse une image par tag, et il a raison :
      # une attestation qui nomme un tag n'atteste de rien de reproductible.
      #
      # Elle doit aussi porter `curl` : les deux sondes réseau rendent 120 sans lui, ce que le
      # harnais lit comme `NotRun`. Ce serait honnête et inutile — on saurait que la sonde n'a pas
      # conclu, pas si le réseau est joignable. D'où une image construite ici plutôt que tirée
      # telle quelle, et sans ENTRYPOINT, qui se substituerait à la commande du workload.
      - name: Image de sonde
        run: |
          set -x
          # Le contexte est un répertoire vide et non `.` : le dépôt entier serait envoyé au
          # démon de build pour une image qui ne copie rien.
          context=$(mktemp -d)
          podman build -t locus-probe -f - "$context" <<'CONTAINERFILE'
          FROM docker.io/library/alpine:3.20
          RUN apk add --no-cache curl
          CONTAINERFILE
          digest=$(podman image inspect --format '{{.Digest}}' locus-probe)
          reference="localhost/locus-probe@${digest}"
          # Une référence par digest sur le stockage local n'est pas garantie de se résoudre. On
          # l'éprouve ici plutôt que de le découvrir dans la table des sondes, où l'échec
          # ressemblerait à un problème de confinement.
          if podman create --name locus-probe-smoke "$reference" true >/dev/null 2>&1; then
            podman rm -f locus-probe-smoke >/dev/null 2>&1 || true
          else
            echo "la référence locale par digest ne se résout pas — repli sur alpine sans curl"
            podman pull docker.io/library/alpine:3.20
            reference=$(podman image inspect --format '{{index .RepoDigests 0}}' docker.io/library/alpine:3.20)
          fi
          echo "LOCUS_PROBE_IMAGE=$reference" >> "$GITHUB_ENV"
          echo "image de sonde : $reference" >> "$GITHUB_STEP_SUMMARY"

      # Ce que le conteneur voit du réseau, imprimé plutôt que déduit.
      #
      # `W5.h` a donné aux deux sondes réseau un constat de route : sans route par défaut, c'est le
      # namespace qui contient ; avec une route mais sans réponse, c'est le monde. Le premier
      # passage a rendu « pas de route », ce qui est soit un fait sur le conteneur, soit une erreur
      # du constat. Les deux se réparent à des endroits opposés, donc on regarde au lieu de
      # supposer.
      - name: Ce que le conteneur voit du réseau
        continue-on-error: true
        run: |
          podman run --rm --network=host "$LOCUS_PROBE_IMAGE" sh -c '
            echo "--- /proc/net/route"; cat /proc/net/route 2>&1 | head -5
            echo "--- resolv.conf"; cat /etc/resolv.conf 2>&1 | head -5
            echo "--- curl example.org"; curl -sS -m 5 -o /dev/null -w "%{http_code}\n" http://example.org/ 2>&1
            echo "--- curl imds"; curl -sS -m 5 -o /dev/null -w "%{http_code}\n" http://169.254.169.254/ 2>&1
          ' 2>&1 | tee reseau.txt
          {
            echo "## Ce que le conteneur voit du réseau"
            echo '```'
            cat reseau.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # `--ignored` est ce qui lance le test, et `--nocapture` ce qui laisse passer la table. Sans
      # elle, un échec dirait « le niveau n'est pas tenu » sans dire laquelle des seize.
      # Ce pas **fait rougir la CI**. Les seize sondes sont exercées à chaque passage sur un
      # conteneur rootless réel, et un confinement qui cesse de tenir doit se voir tout de suite —
      # c'est la seule chose que ni `sh -n` ni un double ne peuvent dire.
      #
      # `--skip` nomme l'exclusion. L'épreuve du quota disque exige un hôte XFS avec quotas de
      # projet ; sur un runner extfs, `podman create` refuse la spécification et le test rend le
      # message du runtime mot pour mot. L'écarter ici n'est pas la sauter en silence : elle a son
      # propre pas, juste en dessous, et ce qu'elle dit y reste lisible.
      #
      # `W5.s` — ce que cette tolérance a **coûté**, écrit pour qu'on ne la repose pas ainsi. Le
      # motif ci-dessus était exact au premier passage : `--storage-opt size=` demande XFS. Puis
      # `W5.j` a déplacé le quota vers l'espace de travail, la spécification s'est mise à porter deux
      # montages sur `/work`, et Podman a commencé à refuser pour une raison **entièrement
      # différente** — `duplicate mount destination`, qu'aucun système de fichiers ne répare. La
      # tolérance a survécu à son motif pendant tout ce temps, et personne ne l'a vu parce que le pas
      # ne rougit pas. C'est `W0.16` sous une autre forme : un motif qui nomme une cause au lieu
      # d'une condition se périme sans prévenir.
      #
      # La garde qui l'empêche de recommencer ne vit pas ici mais dans
      # `apps/locus-execd/tests/podman.rs` — elle ne demande aucun runtime, donc elle rougit sur
      # toutes les machines, y compris celles qui n'ont pas de Podman.
      - name: Les seize sondes contre un conteneur réel
        run: |
          # `--test-threads=1` n'est pas une précaution de confort. Les tests construisent chacun
          # leur `PodmanBackend`, dont le compteur de noms repart à zéro : lancés en parallèle dans
          # le même processus, ils se disputent le nom `locus-0001`, et celui qui perd rapporte
          # l'erreur de nom là où on attend un verdict de confinement.
          cargo test -p locus-execd --test host_sandbox -- --ignored --nocapture --test-threads=1 \
            --skip cet_hote_tient_il_s2_sous_une_mission_qui_reserve_du_disque 2>&1 | tee sondes.txt
          exit "${PIPESTATUS[0]}"

      # Celle-ci reste tolérée, et son motif est écrit : elle demande un hôte XFS. Le jour où le
      # runner en devient un, ce pas rejoint le précédent au lieu d'être supprimé — c'est
      # l'arbitrage de `W5.f`, et il attend un hôte, pas une décision.
      - name: L'épreuve du quota disque, qui attend un hôte XFS
        if: always()
        continue-on-error: true
        run: |
          cargo test -p locus-execd --test host_sandbox -- --ignored --nocapture --test-threads=1 \
            cet_hote_tient_il_s2_sous_une_mission_qui_reserve_du_disque 2>&1 | tee quota.txt
          exit "${PIPESTATUS[0]}"

      # La table est le produit de ce job, verte ou rouge. Elle doit être lisible sans ouvrir les
      # logs bruts, sinon personne ne la lira et l'arbitrage se fera de mémoire.
      - name: La table, dans le résumé
        if: always()
        run: |
          {
            echo "## Les seize sondes contre un conteneur réel"
            echo '```'
            cat sondes.txt 2>/dev/null || echo "le test n'a rien produit"
            echo '```'
            echo "## L'épreuve du quota disque, qui attend un hôte XFS"
            echo '```'
            cat quota.txt 2>/dev/null || echo "le test n'a rien produit"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # ------------------------------------------------------------------------------------------
  # Le harnais de bout en bout — `W12.f`, ADR 0033.
  # ------------------------------------------------------------------------------------------
  #
  # Séparé de `check` exprès (ADR 0033 décision 5) : il demande un second dépôt, une chaîne Bun et
  # deux binaires construits. Le faire entrer dans la porte que chaque item franchit rendrait rouge,
  # sur la machine d'un contributeur, un contrôle qui n'a rien à voir avec ce qu'il vient d'écrire.
  #
  # Il vit ici plutôt que dans `canterel`, et l'ADR le mesure : la CI de ce dépôt a déjà une sandbox
  # `podman` réelle, le verdict appartient à l'endroit où la clause est écrite, et la suite amont de
  # `canterel` s'est révélée instable — trois exécutions sur un arbre identique pour un seul tour
  # entièrement vert. Un verdict qui peut rougir pour une raison étrangère cesse d'être lu.
  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Le worker réel, à une révision épinglée. `continue-on-error` serait la tentation ici — les
      # deux dépôts sont privés et le jeton peut manquer. Elle est refusée : un checkout raté qui
      # laisse le job continuer produirait un `LOCUS_E2E_WORKER` pointant sur un répertoire vide, et
      # le harnais dirait « ce n'est pas un dépôt canterel » au lieu de « le jeton manque ». Deux
      # diagnostics pour une cause, et le mauvais en premier.
      - name: Le dépôt worker
        uses: actions/checkout@v4
        with:
          repository: maribakulj/canterel
          path: .worker
          token: ${{ secrets.CANTEREL_TOKEN || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      # Les deux binaires seulement, pas le workspace : mesuré à 26 s à froid contre plusieurs
      # minutes pour `cargo test --workspace`, dont ce job n'a aucun besoin.
      - name: Les deux binaires
        run: cargo build --bin locusd --bin locus-execd

      - name: Les dépendances du worker
        working-directory: .worker
        run: bun install --frozen-lockfile

      - name: Install
        run: npm ci

      # Le harnais **échoue bruyamment** si l'un des trois processus ne démarre pas, et rend sa
      # sortie. Pas de `continue-on-error` : c'est la règle du dépôt, et `W20.i` a montré ce qu'elle
      # coûte quand on l'oublie.
      - name: La chaîne monte, se voit et s'arrête
        env:
          LOCUS_E2E_WORKER: ${{ github.workspace }}/.worker
        run: npm run e2e
