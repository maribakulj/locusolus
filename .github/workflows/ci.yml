name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # La règle 5 de CLAUDE.md se vérifie en démarrant un Emacs, pas en lisant du code.
      # `--require-emacs` interdit à la garde de sauter cette règle en silence quand le
      # binaire manque : une frontière non vérifiée doit se voir.
      #
      # Chaque tentative est bornée, et il y en a trois. Un miroir apt lent a déjà consommé
      # les dix minutes du job et fait annuler une CI verte par ailleurs : sans borne, la
      # lenteur du réseau devient indistinguable d'un test qui échoue. Le budget du job est
      # passé à vingt minutes pour que la reprise ait la place de servir.
      - name: Install Emacs
        run: |
          for attempt in 1 2 3; do
            if timeout 60 sudo apt-get update -qq \
              && timeout 150 sudo apt-get install -y --no-install-recommends emacs-nox; then
              exit 0
            fi
            echo "tentative $attempt sans succès, reprise"
            sleep $((attempt * 5))
          done
          echo "emacs-nox introuvable après trois tentatives"
          exit 1

      - name: Install
        run: npm ci

      - name: Format
        run: npm run check:format

      - name: Repository layout
        run: npm run check:repo

      - name: Retired project name
        run: npm run check:naming

      - name: Architectural boundaries
        run: npm run check:boundaries -- --require-emacs

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm test

  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml épingle la version et les composants ; rustup l'installe seul.
      - name: Toolchain
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --all-features
