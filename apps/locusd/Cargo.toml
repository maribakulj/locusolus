[package]
name = "locusd"
description = "Le daemon Locus Solus : commandes, queries et événements clients (SPEC_V1 §22)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "locusd"
path = "src/lib.rs"

[[bin]]
name = "locusd"
path = "src/main.rs"

# Aucune dépendance de transport, et c'est l'objet de W20.a : le domaine de commande d'abord, le
# runtime asynchrone et le cadre HTTP après leur ADR. `CLAUDE.md` : « construire domain/protocol/
# event-store d'abord, avec des ports purs ».
[dependencies]
# ADR 0034 : les dix octets d\'aléa d\'un ULID. Déjà dans l\'arbre par `rand` ; le déclarer
# n\'ajoute aucun paquet — mesuré dans `Cargo.lock`.
getrandom = "0.4"
# W20.g : les premières dépendances de transport, autorisées par l'ADR 0018 et portées par
# `dependencies.json`. Les features de `tokio` sont énumérées une par une — `full` apporte `process`
# et `signal`, exactement ce que la règle 4 de `boundaries.json` interdit à `locusd`, et
# `check:deps` la refuse.
# W20.n, ADR 0031 : vérifier une signature Ed25519 et lire une clé publique SPKI. `ring` ferait
# 8 paquets contre 25, et tirerait un compilateur C — ce que l'ADR 0020 a déjà refusé pour
# `blake3`. Neuf des vingt-cinq sont déjà là par `sha2` : le coût marginal réel est de seize.
ed25519-dalek = { version = "2", default-features = false, features = ["pkcs8", "alloc"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros"] }
# `locus-event-store` entre avec W20.b : la transaction *possède* le journal, ce qui est ce qui rend
# la règle « toute mutation passe par un command handler » opposable plutôt que recommandée. Ce
# n'est pas une dépendance de transport — le port est pur, et `CLAUDE.md` demande précisément qu'il
# le soit avant tout runtime.
# W17.f : les six capacités de branche vivent déjà dans ces deux crates ; `locusd` les expose.
# W4.h : le client vers `locus-execd`, par le tube de l'ADR 0028. `locusd` ne dépend **pas**
# de `apps/locus-execd` : les deux dépendent du crate de protocole, sans quoi le daemon
# porterait dans son graphe la seule fonction du dépôt qui exécute `podman`.
# W20.t : la chaîne d'artefacts de §19.1 atteint le daemon. Dépendance interne, donc hors de
# `dependencies.json`, qui ne porte que les dépendances externes.
locus-artifacts = { path = "../../packages/artifacts" }
locus-broker = { path = "../../packages/broker" }
locus-coordination = { path = "../../packages/coordination" }
locus-domain = { path = "../../packages/domain" }
locus-event-store = { path = "../../packages/event-store" }
# W20.d : le composition root câble les projections de §9.5 et le moteur de politique de §20.2.
# Aucune des deux n'est une dépendance de transport — elles sont le domaine que `locusd` assemble.
locus-deployment = { path = "../../packages/deployment" }
locus-policy = { path = "../../packages/policy" }
locus-projections = { path = "../../packages/projections" }
locus-lep = { path = "../../packages/lep" }
locus-protocol = { path = "../../packages/protocol" }
serde = { workspace = true }
# W17.f : la charge d'un `EventDraft` est une `serde_json::Value`, donc le crate passe de
# dev-dependency à dépendance. Déjà autorisé par `dependencies.json`, portée `*`, ADR 0011.
serde_json = { workspace = true }

[dev-dependencies]
# Le test de sortie de W20.g ouvre un vrai socket et écrit une requête HTTP à la main : la feature
# `rt` et les macros suffisent, et aucun client HTTP n'entre. `tokio` est déjà une dépendance.
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "io-util"] }
# `locus-protocol` est déjà une dépendance ; le doctest `compile_fail` de `command.rs` le nomme
# explicitement, et un doctest ne voit que ce que le crate déclare.
serde_json = { workspace = true }
