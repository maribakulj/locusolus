[package]
name = "locus-review"
description = "La revue comme protocole : dossier figé, findings, attestation d'indépendance (SPEC_V1 §17, §14.4)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
locus-domain = { path = "../domain" }
locus-lep = { path = "../lep" }
locus-memory = { path = "../memory" }
locus-protocol = { path = "../protocol" }

[dev-dependencies]
# `W26.c` : les tests construisent une `Trace`, dont la déclaration prend un `ProducedBy`. C'est une
# dépendance de **test** seulement — `packages/review` n'a pas à connaître les artefacts pour porter
# un dévoilement, et l'y faire entrer en dépendance ordinaire élargirait sa surface sans raison.
locus-artifacts = { path = "../artifacts" }
