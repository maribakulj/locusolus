[package]
name = "locus-domain"
description = "Le domaine épistémique de Locus Solus : enveloppe commune, statuts, niveaux de validation."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
locus-protocol = { path = "../protocol" }
serde = { workspace = true }
serde_json = { workspace = true }
# ADR 0020 : le calcul d'un ContentHash. Rien dans le workspace n'en calculait un — `Digest` était
# un trait sans implémentation de production, et les deux écrivains d'événements recevaient leur
# `payload_hash` de l'appelant. Sans features par défaut : `std` n'apporte rien dont `of` ait besoin.
# La portée est ce crate et lui seul (`dependencies.json`) — deux implémentations donneraient deux
# réponses à « quel est le condensat de ceci ».
sha2 = { version = "0.11", default-features = false }
